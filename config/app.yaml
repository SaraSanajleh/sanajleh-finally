# ReTour AI Brain — Application Configuration

app:
  name: ReTour AI Brain  
  version: "1.0.0"  # اول مرة بكون هيك بعدين بعد التعديل وطلعنا فيرجن ثاني بصير 1.1.0
  environment: development # عندس وعند المستخدمين بتكون production
  debug: true # عندي بتكون اكيد بدي معلومات عشان اقدر اصحح بس بال production بتكون فولس

api:
  prefix: /api/v1 #هذا هو الجزء المشترك لكل الـ endpoints
  cors_origins:
    - "http://localhost:3000"
    - "http://127.0.0.1:3000"
    - "http://localhost:3001"
    - "http://127.0.0.1:3001"

prompts:  # هاي معلومات عشان وين موقع البرومبت والتفاصيل اللي بتخصه 
  directory: prompts
  package_generation_sections:
    - 01_role_and_rules.md
    - 02_retriever.md
    - 03_output_schema.md

retriever:
  enabled: true
  base_url: http://127.0.0.1:8001
  timeout_seconds: 120

paths:
  llm_config: config/llm.yaml  # تحديد أماكن الملفات

logging:
  level: INFO #في انواع منها DEBUG, INFO, WARNING, ERROR, CRITICAL طبعا الانفو شاملة لكل الانواع اللي هون الا ال debug
  format: "%(asctime)s | %(levelname)s | %(name)s | %(message)s" # اخترنا الinfo عشان يطلع هذا الشكل بالوقت المعين شو صار 
